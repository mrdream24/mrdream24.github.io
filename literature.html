'简·奥斯汀':'pre1800','歌德':'pre1800','司汤达':'nineteenth','巴尔扎克':'nineteenth','福楼拜':'nineteenth','查尔斯·狄更斯':'nineteenth','乔治·艾略特':'nineteenth','托马斯·哈代':'nineteenth','约瑟夫·康拉德':'nineteenth','果戈理':'nineteenth','屠格涅夫':'nineteenth','陀思妥耶夫斯基':'nineteenth','列夫·托尔斯泰':'nineteenth','契诃夫':'nineteenth','赫尔曼·梅尔维尔':'nineteenth','亨利·詹姆斯':'nineteenth','鲁迅':'modernism','老舍':'modernism','沈从文':'modernism','张爱玲':'modernism','夏目漱石':'modernism','谷崎润一郎':'modernism','川端康成':'modernism','托马斯·曼':'modernism','弗兰茨·卡夫卡':'modernism','赫尔曼·黑塞':'modernism','罗伯特·穆齐尔':'modernism','詹姆斯·乔伊斯':'modernism','弗吉尼亚·伍尔夫':'modernism','普鲁斯特':'modernism','威廉·福克纳':'modernism','欧内斯特·海明威':'modernism','博尔赫斯':'modernism','豪尔赫·路易斯·博尔赫斯':'modernism','布尔加科夫':'modernism','阿尔贝·加缪':'postwar','玛格丽特·杜拉斯':'postwar','米兰·昆德拉':'postwar','胡安·鲁尔福':'postwar','加西亚·马尔克斯':'postwar','马里奥·巴尔加斯·略萨':'postwar','胡利奥·科塔萨尔':'postwar','伊塔洛·卡尔维诺':'postwar','翁贝托·埃科':'postwar','大江健三郎':'postwar','钱钟书':'postwar','王小波':'postwar','莫言':'contemporary','余华':'contemporary','阎连科':'contemporary','残雪':'contemporary','石黑一雄':'contemporary','托妮·莫里森':'contemporary','唐·德里罗':'contemporary','大卫·福斯特·华莱士':'contemporary','科马克·麦卡锡':'contemporary','罗贝托·波拉尼奥':'contemporary','埃莱娜·费兰特':'contemporary','村上春树':'contemporary','多和田叶子':'contemporary'};
const search=document.getElementById('search'),countrySel=document.getElementById('countrySel'),authorRating=document.getElementById('authorRating'),workRating=document.getElementById('workRating'),content=document.getElementById('content'),empty=document.getElementById('empty');
data.forEach(x=>countrySel.insertAdjacentHTML('beforeend',`<option>${x.country}</option>`));
let state='all',view='author';const saved=JSON.parse(localStorage.getItem('literature-progress')||'{}');
const idOf=(c,a,w)=>[c,a,w].join('::');const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);const periodOf=n=>periodMap[n]||'contemporary';const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fallbackCover(title,author,country){const palettes=[['#19362f','#f4ead7','#c89d62'],['#55312f','#f7eddd','#d3a86d'],['#26364f','#f1eadc','#b98b57'],['#453b52','#f4ecdf','#c49b67'],['#4a402e','#f4ead9','#b88c52']];let h=0;for(const c of title)h=(h*31+c.charCodeAt(0))>>>0;const [bg,fg,accent]=palettes[h%palettes.length];const chars=[...title],lines=[];const size=chars.length>14?20:chars.length>9?24:29;const per=chars.length>12?6:chars.length>7?5:4;for(let i=0;i<chars.length&&lines.length<4;i+=per)lines.push(chars.slice(i,i+per).join(''));const tspans=lines.map((line,i)=>`<tspan x="24" dy="${i?size*1.28:0}">${esc(line)}</tspan>`).join('');const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="360" viewBox="0 0 240 360"><rect width="240" height="360" rx="10" fill="${bg}"/><rect x="13" y="13" width="214" height="334" rx="5" fill="none" stroke="${fg}" stroke-opacity=".28"/><path d="M24 54h72" stroke="${accent}" stroke-width="4"/><text x="24" y="92" fill="${fg}" font-family="Songti SC,STSong,serif" font-size="${size}" font-weight="700">${tspans}</text><text x="24" y="300" fill="${fg}" opacity=".82" font-family="system-ui,sans-serif" font-size="13">${esc(author)}</text><text x="24" y="326" fill="${accent}" font-family="system-ui,sans-serif" font-size="10" letter-spacing="2">${esc(country)} · READING POOL</text></svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}
const coverKey=(title,author)=>'bookCover:v2:'+title+'|'+author;
async function loadCover(img){if(img.dataset.loaded)return;img.dataset.loaded='1';const key=coverKey(img.dataset.title,img.dataset.author),cached=localStorage.getItem(key);if(cached){if(cached!=='fallback')img.src=cached;return}try{const q=encodeURIComponent(`intitle:${img.dataset.title} inauthor:${img.dataset.author}`),r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${q}&maxResults=5&printType=books`);if(!r.ok)throw new Error('cover request failed');const json=await r.json();const item=(json.items||[]).find(x=>x.volumeInfo&&x.volumeInfo.imageLinks);const raw=item&&item.volumeInfo.imageLinks&&(item.volumeInfo.imageLinks.thumbnail||item.volumeInfo.imageLinks.smallThumbnail);if(!raw){localStorage.setItem(key,'fallback');return}const url=raw.replace(/^http:/,'https:').replace('&zoom=1','&zoom=2');img.onerror=()=>{img.onerror=null;img.src=img.dataset.fallback;localStorage.setItem(key,'fallback')};img.src=url;localStorage.setItem(key,url)}catch(e){localStorage.setItem(key,'fallback')}}
function bindCovers(){const imgs=[...document.querySelectorAll('.book-cover')];if(!('IntersectionObserver'in window)){imgs.forEach(loadCover);return}const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);loadCover(e.target)}}),{rootMargin:'240px'});imgs.forEach(img=>io.observe(img))}
function buildAuthorCard(group,a,idx,q){if(a.rating<+authorRating.value)return '';const authorText=(group.country+a.name+a.era).toLowerCase();let works='';[...a.works].sort((x,y)=>y[1]-x[1]).forEach((w,wi)=>{if(w[1]<+workRating.value)return;const id=idOf(group.country,a.name,w[0]),isDone=!!saved[id];const text=(authorText+w.join(' ')).toLowerCase();if(q&&!text.includes(q))return;if(state==='done'&&!isDone)return;if(state==='unread'&&isDone)return;window._visible++;window._total++;if(isDone)window._done++;const fallback=fallbackCover(w[0],a.name,group.country);works+=`<div class="work ${isDone?'done':''}" data-id="${id}"><input type="checkbox" ${isDone?'checked':''}><img class="book-cover" src="${fallback}" data-fallback="${fallback}" data-title="${esc(w[0])}" data-author="${esc(a.name)}" alt="《${esc(w[0])}》封面" loading="lazy"><div><div class="work-title">${wi+1}. 《${w[0]}》${w[1]===5?'<span class="badge">首选</span>':''}</div><div class="work-sub">${w[2]}</div></div><div class="work-rank" title="作品推荐度">${stars(w[1])}</div></div>`});if(!works)return '';return `<article class="author-card"><div class="author-head"><div class="author-index">${String(idx+1).padStart(2,'0')}</div><div class="author-info"><div class="author-name">${a.name}</div><div class="author-meta">${a.era} · ${a.works.length} 部代表作</div></div><div class="rating" title="作家推荐度">${stars(a.rating)}</div></div><div class="works">${works}</div></article>`}
function renderAuthor(q){let html='';data.forEach(group=>{if(countrySel.value!=='all'&&countrySel.value!==group.country)return;let ahtml='';[...group.authors].sort((a,b)=>b.rating-a.rating||a.name.localeCompare(b.name,'zh-CN')).forEach((a,idx)=>ahtml+=buildAuthorCard(group,a,idx,q));if(ahtml)html+=`<section class="country"><div class="country-head"><h2>${group.country}</h2><p>${group.authors.length} 位作家 · 按推荐度排列</p></div><div class="authors">${ahtml}</div></section>`});return html}
function renderTime(q){let html='';periods.forEach(period=>{let countries='';data.forEach(group=>{if(countrySel.value!=='all'&&countrySel.value!==group.country)return;let ahtml='';const authors=group.authors.filter(a=>periodOf(a.name)===period.key).sort((a,b)=>b.rating-a.rating||a.name.localeCompare(b.name,'zh-CN'));authors.forEach((a,idx)=>ahtml+=buildAuthorCard(group,a,idx,q));if(ahtml)countries+=`<div class="period-country"><h3>${group.country}</h3><div class="authors">${ahtml}</div></div>`});if(countries)html+=`<section class="period"><div class="period-head"><h2>${period.title}</h2><p>${period.desc}</p></div>${countries}</section>`});return html}
function bindChecks(){document.querySelectorAll('.work input').forEach(x=>x.onchange=()=>{const row=x.closest('.work'),id=row.dataset.id;if(x.checked)saved[id]=1;else delete saved[id];localStorage.setItem('literature-progress',JSON.stringify(saved));render()})}
function render(){const q=search.value.trim().toLowerCase();window._visible=0;window._total=0;window._done=0;content.innerHTML=view==='author'?renderAuthor(q):renderTime(q);empty.style.display=window._visible?'none':'block';bindChecks();bindCovers();document.getElementById('doneCount').textContent=window._done;document.getElementById('totalCount').textContent=window._total;document.getElementById('progressBar').style.width=window._total?(window._done/window._total*100)+'%':'0%'}
[search,countrySel,authorRating,workRating].forEach(x=>x.addEventListener(x===search?'input':'change',render));document.querySelectorAll('.filter').forEach(x=>x.onclick=()=>{document.querySelectorAll('.filter').forEach(y=>y.classList.remove('active'));x.classList.add('active');state=x.dataset.state;render()});document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{document.querySelectorAll('.tab').forEach(y=>y.classList.remove('active'));x.classList.add('active');view=x.dataset.view;render()});render();
</script>
</body>
</html>
