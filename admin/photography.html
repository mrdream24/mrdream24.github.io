<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>上传 · 一日一帧</title><link rel="stylesheet" href="../css/photography-admin.css"></head><body><main class="shell"><header><div><span>DAILY FRAME / ADMIN</span><h1>上传今日一帧</h1></div><div class="account"><button id="loginButton" type="button">检查登录</button><a href="../photography.html">查看前台 ↗</a></div></header><section class="editor"><label id="dropZone" class="drop"><input id="imageInput" type="file" accept="image/*" hidden><img id="preview" alt="预览" hidden><div id="dropHint"><b>＋</b><span>选择照片</span><small>JPEG / HEIC / PNG / WebP</small></div></label><div class="form"><label>拍摄日期<input id="photoDate" type="date"></label><label>地点<input id="location" maxlength="120" placeholder="Shanghai"></label><label>照片说明<textarea id="caption" maxlength="500" rows="3" placeholder="今天看见了什么？"></textarea></label><label>摄影笔记<textarea id="note" maxlength="4000" rows="5" placeholder="构图、光线、失败与尝试……"></textarea></label><section class="exif"><h2>EXIF</h2><div id="exifView">选择照片后读取基础信息</div></section><button id="publishButton" class="publish" type="button" disabled>发布今日照片</button><p id="status" role="status"></p></div></section></main><script src="./config.js"></script><script src="../js/photography-admin.js"></script></body></html>
